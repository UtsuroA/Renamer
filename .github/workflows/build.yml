name: Build Windows portable EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check files
        run: |
          dir
          type package.json

      - name: Install dependencies
        run: npm install --verbose

      - name: Build EXE
        run: npm run build

      - name: Show dist
        run: |
          dir dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BatchRenamer-Portable
          path: dist/**/*.exe
